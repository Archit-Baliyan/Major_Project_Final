{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Settings{% endblock %}
{% block content %}
<h3 class="page-title mb-3">System Settings</h3>
<div class="card" style="max-width:520px"><div class="card-body">
  <form method="post" class="needs-validation" novalidate>{{ csrf() }}
    <label class="form-label fw-semibold">Minimum required attendance (%)</label>
    <input type="number" name="min_attendance" class="form-control mb-2" min="1" max="100" step="0.5" value="{{ '%g'|format(min_att) }}" required>
    <div class="form-text mb-3">Used for low-attendance warnings, "students at risk" and the dashboards for every role.</div>
    <button class="btn btn-primary"><i class="bi bi-save"></i> Save</button>
  </form></div></div>
{% endblock %}
